# payment-service: payments and the Razorpay integration.
airline:
  # Transactional outbox: events commit with the state change and are relayed to Kafka (common-lib OutboxRelay).
  outbox:
    enabled: true
  payment:
    currency: ${PAYMENT_CURRENCY:INR}
    # Safety net for payments neither the browser nor the webhook reported: every `interval`, pending payments
    # older than `min-age` (and younger than `max-age`) are checked with the provider and settled or failed.
    reconciliation:
      enabled: ${PAYMENT_RECONCILIATION_ENABLED:true}
      interval: ${PAYMENT_RECONCILIATION_INTERVAL:PT2M}
      min-age: PT2M
      max-age: PT24H
      batch-size: 50
    razorpay:
      key-id: ${RAZORPAY_KEY_ID}
      key-secret: ${RAZORPAY_KEY_SECRET}
      # Secret configured on the Razorpay dashboard webhook; used to verify X-Razorpay-Signature.
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET}
      callback-base-url: ${PAYMENT_CALLBACK_BASE_URL}
