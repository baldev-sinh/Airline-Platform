# booking-service: PNRs, passengers, tickets; orchestrates the checkout saga.
spring:
  cloud:
    openfeign:
      client:
        config:
          # Creating a payment includes a round trip to the payment provider (Razorpay) over the internet,
          # which took ~6.5 s in test mode, so this client gets more time. It must stay below the gateway's
          # 15 s read timeout, which covers the whole booking request.
          payment-service:
            read-timeout: ${FEIGN_PAYMENT_READ_TIMEOUT_MS:10000}

airline:
  # Transactional outbox: events commit with the state change and are relayed to Kafka (common-lib OutboxRelay).
  outbox:
    enabled: true
  booking:
    max-passengers: 9
