# Security headers sent with every response.
#
# Why a separate file? In nginx, an `add_header` inside a `location` block REPLACES all headers
# inherited from the server block. Including this file in each location keeps them on every response.

# Content-Security-Policy: the browser's allow-list of where code may come from. It is the main
# defence against cross-site scripting (XSS): injected <script> tags simply won't run.
#   - scripts and styles: only our own files, plus inline ones carrying this request's nonce
#     (nginx writes the same random $request_id into index.html, see default.conf.template)
#   - img-src https: airline logos may be hosted elsewhere
#   - connect-src 'self': the app only calls its own origin (/api is proxied below)
#   - frame-ancestors 'none': nobody may embed the site in an iframe (clickjacking)
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$request_id'; style-src 'self' 'nonce-$request_id'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# HSTS (force HTTPS) belongs on the TLS terminator (load balancer / ingress) in front of this
# container, because this container itself speaks plain HTTP on port 8080.
