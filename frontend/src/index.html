<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <title>Baldev Airways | Book flights</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Book Baldev Airways flights: choose your seat, add meals and bags, and get your e-ticket instantly."
    />
    <meta name="theme-color" content="#0f4c5c" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  </head>
  <body>
    <!--
      ngCspNonce: in production, nginx replaces CSP_NONCE with a random value for every response
      and sends the same value in the Content-Security-Policy header (see nginx/default.conf).
      Angular then tags the <style> elements it creates with that nonce, so the browser accepts
      them while still blocking any injected script or style.
    -->
    <app-root ngCspNonce="CSP_NONCE"></app-root>
    <noscript>
      <p>Please turn on JavaScript to book flights, or call customer care on +91 22 4000 1234.</p>
    </noscript>
  </body>
</html>
