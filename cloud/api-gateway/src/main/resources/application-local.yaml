# Local development profile (SPRING_PROFILES_ACTIVE=local). Never use in production.
airline:
  security:
    jwt:
      secret: ${JWT_SECRET:local-dev-only-jwt-secret-change-me-0123456789abcdef}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    com.baldev.airline: DEBUG
