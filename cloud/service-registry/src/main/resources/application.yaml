server:
  port: ${SERVER_PORT:8761}
  shutdown: graceful

spring:
  application:
    name: service-registry

eureka:
  instance:
    hostname: ${EUREKA_HOSTNAME:localhost}
  client:
    # Standalone registry. For HA, run 2+ replicas and point defaultZone at the peers.
    register-with-eureka: ${EUREKA_REGISTER_WITH_PEERS:false}
    fetch-registry: ${EUREKA_REGISTER_WITH_PEERS:false}
    service-url:
      defaultZone: ${EUREKA_PEER_URLS:http://localhost:8761/eureka/}
  server:
    enable-self-preservation: ${EUREKA_SELF_PRESERVATION:true}
    eviction-interval-timer-in-ms: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  observations:
    key-values:
      # Every metric is tagged with the service name, like the business services, so dashboards can tell them apart.
      application: ${spring.application.name}
