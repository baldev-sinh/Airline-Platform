<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="${subject}">Refund processed</title>
</head>
<body style="margin:0;background:#f3f4f6;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0">
    <tr>
        <td align="center" style="padding:24px 12px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                   style="max-width:600px;background:#ffffff;border-radius:8px;overflow:hidden;">
                <tr><td th:insert="~{email/fragments :: header}"></td></tr>
                <tr>
                    <td style="padding:24px;font-family:Arial,Helvetica,sans-serif;color:#111827;font-size:15px;line-height:1.5;">
                        <p style="margin:0 0 12px;">We refunded <strong th:text="${amount}">INR 4999.00</strong> for
                            booking <strong th:text="${reference}">ABC123</strong>
                            (<span th:text="${flightNumber}">BA101</span>).</p>
                        <p style="margin:0 0 12px;">Banks usually show the money within 5 to 7 working days. If you
                            contact your bank, quote refund reference
                            <span style="font-family:monospace;" th:text="${refundId}">rfnd_123</span>.</p>
                    </td>
                </tr>
                <tr><td th:insert="~{email/fragments :: footer}"></td></tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
