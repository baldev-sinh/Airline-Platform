<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="${subject}">Welcome</title>
</head>
<body style="margin:0;background:#f3f4f6;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0">
    <tr>
        <td align="center" style="padding:24px 12px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                   style="max-width:600px;background:#ffffff;border-radius:8px;overflow:hidden;">
                <tr><td th:insert="~{email/fragments :: header}"></td></tr>
                <tr>
                    <td style="padding:24px;font-family:Arial,Helvetica,sans-serif;color:#111827;font-size:15px;line-height:1.5;">
                        <p style="margin:0 0 12px;">Hi <span th:text="${name}">there</span>,</p>
                        <p style="margin:0 0 12px;">Your account is ready. Search for a flight, pick your seats and
                            extras, and you are booked in a few minutes.</p>
                        <p style="margin:24px 0;">
                            <a th:href="${siteUrl + '/flights'}"
                               style="background:#0b3d91;color:#ffffff;padding:12px 20px;border-radius:6px;text-decoration:none;">Find a flight</a>
                        </p>
                        <p style="margin:0;color:#6b7280;font-size:13px;">Did not sign up? You can ignore this e-mail.</p>
                    </td>
                </tr>
                <tr><td th:insert="~{email/fragments :: footer}"></td></tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
