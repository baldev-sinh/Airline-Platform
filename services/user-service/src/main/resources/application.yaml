# Base configuration with production-safe defaults.
# Environment-specific values come from environment variables. Secrets have NO defaults, so a misconfigured
# deployment fails fast at startup instead of running with insecure values.
# For local development run with SPRING_PROFILES_ACTIVE=local (see application-local.yaml).
server:
  port: ${SERVER_PORT:5001}
  shutdown: graceful

spring:
  application:
    name: user-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  threads:
    virtual:
      enabled: true
  web:
    error:
      # Moved from server.error.* in Spring Boot 4; the old key is no longer read.
      include-stacktrace: never
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: 2
      connection-timeout: 5000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway migrations (src/main/resources/db/migration); Hibernate only validates it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10

airline:
  security:
    jwt:
      # HMAC-SHA key shared with the API gateway; at least 32 bytes (256 bits). Inject from a secret store.
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:airline-user-service}
      expiration: ${JWT_EXPIRATION:PT1H}
  bootstrap-admin:
    # Creates the first system admin on startup if both values are set and the email does not exist yet.
    # Leave unset in steady state; rotate the password after first login.
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
    export:
      enabled: ${TRACING_EXPORT_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        enabled: false
  observations:
    key-values:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    com.baldev.airline: INFO
