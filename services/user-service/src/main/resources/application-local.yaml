# Local development profile (SPRING_PROFILES_ACTIVE=local).
# Points at the databases started by docker-compose/docker-compose.yml. Never use this profile in production.
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3302/airline_user_db}
    username: ${DB_USERNAME:airline}
    password: ${DB_PASSWORD:airline}

airline:
  security:
    jwt:
      # Local-only development key. Production MUST inject JWT_SECRET from a secret store.
      secret: ${JWT_SECRET:local-dev-only-jwt-secret-change-me-0123456789abcdef}
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:admin@airline.local}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:ChangeMe!Local123}

management:
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    com.baldev.airline: DEBUG
