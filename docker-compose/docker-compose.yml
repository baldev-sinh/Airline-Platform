# Full platform for local integration testing and demos.
#
#   cp docker-compose/.env.example docker-compose/.env   # then fill in the secrets
#   mvn -B -DskipTests package jib:dockerBuild            # build images into the local Docker daemon
#   docker compose -f docker-compose/docker-compose.yml --env-file docker-compose/.env up -d
#
# Start order: databases, Kafka, Redis -> config-server -> service-registry -> services -> gateway -> web.
#
# Production does not run on Compose: use managed MySQL/Kafka and an orchestrator (e.g. Kubernetes), injecting
# the same environment variables from a secret store. Only the gateway (and, for debugging, the registry UI and
# database ports bound to 127.0.0.1) are published.

name: airline

# Docker keeps container logs forever by default, which eventually fills the disk. Keep 3 files of 10 MB each.
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-mysql: &mysql
  image: mysql:8.4
  restart: unless-stopped
  logging: *logging
  mem_limit: 512m
  networks: [ backend ]
  command: [ "--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--default-time-zone=+00:00" ]
  healthcheck:
    test: [ "CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent" ]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 20s

x-mysql-env: &mysql-env
  MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
  MYSQL_USER: airline
  MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}

x-service: &service
  restart: unless-stopped
  logging: *logging
  mem_limit: 768m
  networks: [ backend ]
  healthcheck:
    test: [ "CMD-SHELL", "curl -fsS http://localhost:$${SERVER_PORT}/actuator/health/readiness || exit 1" ]
    interval: 15s
    timeout: 5s
    retries: 10
    start_period: 60s

x-service-env: &service-env
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75 -XX:+UseG1GC"
  # Central configuration (config-repo/ served by config-server); secrets stay in this environment.
  CONFIG_SERVER_URL: http://config-server:8888
  CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD:?set CONFIG_SERVER_PASSWORD in .env}
  EUREKA_URL: http://service-registry:8761/eureka/
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  REDIS_HOST: redis
  REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
  DB_USERNAME: airline
  DB_PASSWORD: ${DB_PASSWORD}
  LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
  TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-0.1}

services:

  # ---------------------------------------------------------------- data stores (one database per service)
  userdb:
    <<: *mysql
    environment: { <<: *mysql-env, MYSQL_DATABASE: airline_user_db }
    ports: [ "127.0.0.1:3302:3306" ]
    volumes: [ userdb-data:/var/lib/mysql ]
  airlinecoredb:
    <<: *mysql
    environment: { <<: *mysql-env, MYSQL_DATABASE: airline_core_db }
    ports: [ "127.0.0.1:3303:3306" ]
    volumes: [ airlinecoredb-data:/var/lib/mysql ]
  flightopsdb:
    <<: *mysql
    environment: { <<: *mysql-env, MYSQL_DATABASE: airline_flight_db }
    ports: [ "127.0.0.1:3304:3306" ]
    volumes: [ flightopsdb-data:/var/lib/mysql ]
  locationdb:
    <<: *mysql
    environment: { <<: *mysql-env, MYSQL_DATABASE: airline_location_db }
    ports: [ "127.0.0.1:3305:3306" ]
    volumes: [ locationdb-data:/var/lib/mysql ]
  pricingdb:
    <<: *mysql
    environment: { <<: *mysql-env, MYSQL_DATABASE: airline_pricing_db }
    ports: [ "127.0.0.1:3307:3306" ]
    volumes: [ pricingdb-data:/var/lib/mysql ]
  ancillarydb:
    <<: *mysql
    environment: { <<: *mysql-env, MYSQL_DATABASE: airline_ancillary_db }
    ports: [ "127.0.0.1:3308:3306" ]
    volumes: [ ancillarydb-data:/var/lib/mysql ]
  bookingdb:
    <<: *mysql
    environment: { <<: *mysql-env, MYSQL_DATABASE: airline_booking_db }
    ports: [ "127.0.0.1:3309:3306" ]
    volumes: [ bookingdb-data:/var/lib/mysql ]
  paymentdb:
    <<: *mysql
    environment: { <<: *mysql-env, MYSQL_DATABASE: airline_payment_db }
    ports: [ "127.0.0.1:3310:3306" ]
    volumes: [ paymentdb-data:/var/lib/mysql ]
  seatdb:
    <<: *mysql
    environment: { <<: *mysql-env, MYSQL_DATABASE: airline_seat_db }
    ports: [ "127.0.0.1:3311:3306" ]
    volumes: [ seatdb-data:/var/lib/mysql ]
  notificationdb:
    <<: *mysql
    environment: { <<: *mysql-env, MYSQL_DATABASE: airline_notification_db }
    ports: [ "127.0.0.1:3312:3306" ]
    volumes: [ notificationdb-data:/var/lib/mysql ]

  # Shared cache, gateway rate limits and access-token revocations. Password protected; keys expire on their own.
  # noeviction: under memory pressure writes fail (caches then fall back to the database) instead of silently
  # dropping revocation entries. Append-only file so revocations survive a restart.
  redis:
    image: redis:8.2-alpine
    restart: unless-stopped
    logging: *logging
    mem_limit: 320m
    networks: [ backend ]
    ports: [ "127.0.0.1:6379:6379" ]
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}",
               "--maxmemory", "256mb", "--maxmemory-policy", "noeviction",
               "--appendonly", "yes", "--appendfsync", "everysec" ]
    volumes: [ redis-data:/data ]
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG" ]
      interval: 10s
      timeout: 5s
      retries: 12
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # Local SMTP server that catches every e-mail notification-service sends: inbox at http://localhost:8025.
  # Not used in production (docker-compose.prod.yml points notification-service at a real SMTP provider).
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    logging: *logging
    mem_limit: 128m
    networks: [ backend ]
    ports: [ "127.0.0.1:8025:8025", "127.0.0.1:1025:1025" ]

  kafka:
    image: apache/kafka:4.2.0
    restart: unless-stopped
    logging: *logging
    mem_limit: 1g
    networks: [ backend ]
    ports: [ "127.0.0.1:29092:29092" ]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # INTERNAL is what containers use; EXTERNAL lets services running on the host (local profile) connect.
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Topics are declared by the services (KafkaErrorHandlingAutoConfiguration); typos must not create topics.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx768m"
    volumes: [ kafka-data:/var/lib/kafka/data ]
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  # Web UI for browsing topics, messages (with headers), consumer groups and lag: http://localhost:8090
  # Local debugging only: it has no login, so it is bound to 127.0.0.1 and runs read-only (no producing,
  # deleting or resetting offsets). Set KAFKA_CLUSTERS_0_READONLY to "false" to replay a DLT message by hand.
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.4.2
    restart: unless-stopped
    logging: *logging
    mem_limit: 512m
    networks: [ backend ]
    ports: [ "127.0.0.1:8090:8080" ]
    environment:
      KAFKA_CLUSTERS_0_NAME: airline-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_READONLY: "true"
      DYNAMIC_CONFIG_ENABLED: "false"
    depends_on:
      kafka: { condition: service_healthy }

  # ---------------------------------------------------------------- monitoring (local only, bound to 127.0.0.1)
  # Prometheus scrapes /actuator/prometheus on every service: http://localhost:9090 (Status > Target health).
  # PROMETHEUS_TARGETS=host (default) scrapes services started by scripts/start-local.ps1 on this machine;
  # PROMETHEUS_TARGETS=compose scrapes the service containers of this project.
  prometheus:
    image: prom/prometheus:v3.15.1
    restart: unless-stopped
    logging: *logging
    mem_limit: 512m
    networks: [ backend ]
    ports: [ "127.0.0.1:9090:9090" ]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    # host.docker.internal is built into Docker Desktop; this line makes it work on Linux Docker too.
    extra_hosts: [ "host.docker.internal:host-gateway" ]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/targets-${PROMETHEUS_TARGETS:-host}.yml:/etc/prometheus/targets/services.yml:ro
      - prometheus-data:/prometheus

  # Grafana with the Prometheus data source and the "Airline services" dashboard provisioned:
  # http://localhost:3000, user admin, password GRAFANA_ADMIN_PASSWORD from .env.
  grafana:
    image: grafana/grafana:13.2.4
    restart: unless-stopped
    logging: *logging
    mem_limit: 512m
    networks: [ backend ]
    ports: [ "127.0.0.1:3000:3000" ]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/airline-services.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [ prometheus ]

  # ---------------------------------------------------------------- platform
  # Configuration for every service, from config-repo/ (mounted here so edits apply on restart or
  # POST /actuator/refresh; the image also contains a copy). Set SPRING_PROFILES_ACTIVE=git and CONFIG_GIT_URI
  # to serve it from a Git repository instead.
  config-server:
    <<: *service
    image: ${IMAGE_REGISTRY:-baldevsinh}/airline-config-server:${IMAGE_TAG:-0.0.1-SNAPSHOT}
    mem_limit: 384m
    ports: [ "127.0.0.1:8888:8888" ]
    environment:
      SERVER_PORT: 8888
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75 -XX:+UseG1GC"
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD:?set CONFIG_SERVER_PASSWORD in .env}
      CONFIG_REPO_LOCATION: file:/config-repo/
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    volumes:
      - ../config-repo:/config-repo:ro

  service-registry:
    <<: *service
    image: ${IMAGE_REGISTRY:-baldevsinh}/airline-service-registry:${IMAGE_TAG:-0.0.1-SNAPSHOT}
    mem_limit: 512m
    ports: [ "127.0.0.1:8761:8761" ]
    environment:
      SERVER_PORT: 8761
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75 -XX:+UseG1GC"
      EUREKA_HOSTNAME: service-registry

  api-gateway:
    <<: *service
    image: ${IMAGE_REGISTRY:-baldevsinh}/airline-api-gateway:${IMAGE_TAG:-0.0.1-SNAPSHOT}
    networks: [ backend, edge ]
    ports: [ "5000:5000" ]
    healthcheck:
      # Management endpoints live on 5100 (not published), not on the public port.
      test: [ "CMD-SHELL", "curl -fsS http://localhost:5100/actuator/health/readiness || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      config-server: { condition: service_healthy }
      service-registry: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      <<: *service-env
      SERVER_PORT: 5000
      MANAGEMENT_PORT: 5100
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-${PUBLIC_BASE_URL:-http://localhost:5173}}

  # ---------------------------------------------------------------- business services (internal only)
  user-service:
    <<: *service
    image: ${IMAGE_REGISTRY:-baldevsinh}/airline-user-service:${IMAGE_TAG:-0.0.1-SNAPSHOT}
    depends_on:
      config-server: { condition: service_healthy }
      redis: { condition: service_healthy }
      service-registry: { condition: service_healthy }
      userdb: { condition: service_healthy }
    environment:
      <<: *service-env
      SERVER_PORT: 5001
      DB_URL: jdbc:mysql://userdb:3306/airline_user_db
      # RS256 private key (PKCS#8 PEM, "\n" escapes allowed) that signs access tokens; only user-service has it.
      # Required in docker-compose.prod.yml; user-service also refuses to start without it outside the local profile.
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}

  airline-core-service:
    <<: *service
    image: ${IMAGE_REGISTRY:-baldevsinh}/airline-airline-core-service:${IMAGE_TAG:-0.0.1-SNAPSHOT}
    depends_on:
      config-server: { condition: service_healthy }
      redis: { condition: service_healthy }
      service-registry: { condition: service_healthy }
      airlinecoredb: { condition: service_healthy }
    environment:
      <<: *service-env
      SERVER_PORT: 5002
      DB_URL: jdbc:mysql://airlinecoredb:3306/airline_core_db

  location-service:
    <<: *service
    image: ${IMAGE_REGISTRY:-baldevsinh}/airline-location-service:${IMAGE_TAG:-0.0.1-SNAPSHOT}
    depends_on:
      config-server: { condition: service_healthy }
      redis: { condition: service_healthy }
      service-registry: { condition: service_healthy }
      locationdb: { condition: service_healthy }
    environment:
      <<: *service-env
      SERVER_PORT: 5004
      DB_URL: jdbc:mysql://locationdb:3306/airline_location_db

  pricing-service:
    <<: *service
    image: ${IMAGE_REGISTRY:-baldevsinh}/airline-pricing-service:${IMAGE_TAG:-0.0.1-SNAPSHOT}
    depends_on:
      config-server: { condition: service_healthy }
      redis: { condition: service_healthy }
      service-registry: { condition: service_healthy }
      pricingdb: { condition: service_healthy }
    environment:
      <<: *service-env
      SERVER_PORT: 5005
      DB_URL: jdbc:mysql://pricingdb:3306/airline_pricing_db

  seat-service:
    <<: *service
    image: ${IMAGE_REGISTRY:-baldevsinh}/airline-seat-service:${IMAGE_TAG:-0.0.1-SNAPSHOT}
    depends_on:
      config-server: { condition: service_healthy }
      redis: { condition: service_healthy }
      service-registry: { condition: service_healthy }
      seatdb: { condition: service_healthy }
      kafka: { condition: service_healthy }
    environment:
      <<: *service-env
      SERVER_PORT: 5006
      DB_URL: jdbc:mysql://seatdb:3306/airline_seat_db

  ancillary-service:
    <<: *service
    image: ${IMAGE_REGISTRY:-baldevsinh}/airline-ancillary-service:${IMAGE_TAG:-0.0.1-SNAPSHOT}
    depends_on:
      config-server: { condition: service_healthy }
      redis: { condition: service_healthy }
      service-registry: { condition: service_healthy }
      ancillarydb: { condition: service_healthy }
    environment:
      <<: *service-env
      SERVER_PORT: 5008
      DB_URL: jdbc:mysql://ancillarydb:3306/airline_ancillary_db

  booking-service:
    <<: *service
    image: ${IMAGE_REGISTRY:-baldevsinh}/airline-booking-service:${IMAGE_TAG:-0.0.1-SNAPSHOT}
    depends_on:
      config-server: { condition: service_healthy }
      redis: { condition: service_healthy }
      service-registry: { condition: service_healthy }
      bookingdb: { condition: service_healthy }
      kafka: { condition: service_healthy }
    environment:
      <<: *service-env
      SERVER_PORT: 5009
      DB_URL: jdbc:mysql://bookingdb:3306/airline_booking_db

  payment-service:
    <<: *service
    image: ${IMAGE_REGISTRY:-baldevsinh}/airline-payment-service:${IMAGE_TAG:-0.0.1-SNAPSHOT}
    depends_on:
      config-server: { condition: service_healthy }
      redis: { condition: service_healthy }
      service-registry: { condition: service_healthy }
      paymentdb: { condition: service_healthy }
      kafka: { condition: service_healthy }
    environment:
      <<: *service-env
      SERVER_PORT: 5010
      DB_URL: jdbc:mysql://paymentdb:3306/airline_payment_db
      # Set PAYMENT_SPRING_PROFILES=payment-stub in .env to test without Razorpay (see .env.example).
      SPRING_PROFILES_ACTIVE: ${PAYMENT_SPRING_PROFILES:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:?set RAZORPAY_KEY_ID in .env}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:?set RAZORPAY_KEY_SECRET in .env}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:?set RAZORPAY_WEBHOOK_SECRET in .env}
      # Where Razorpay sends the customer back to: the site's public address (PUBLIC_BASE_URL).
      PAYMENT_CALLBACK_BASE_URL: ${PAYMENT_CALLBACK_BASE_URL:-${PUBLIC_BASE_URL:-http://localhost:5173}}

  flight-ops-service:
    <<: *service
    image: ${IMAGE_REGISTRY:-baldevsinh}/airline-flight-ops-service:${IMAGE_TAG:-0.0.1-SNAPSHOT}
    depends_on:
      config-server: { condition: service_healthy }
      redis: { condition: service_healthy }
      service-registry: { condition: service_healthy }
      flightopsdb: { condition: service_healthy }
      kafka: { condition: service_healthy }
    environment:
      <<: *service-env
      SERVER_PORT: 5011
      DB_URL: jdbc:mysql://flightopsdb:3306/airline_flight_db

  notification-service:
    <<: *service
    image: ${IMAGE_REGISTRY:-baldevsinh}/airline-notification-service:${IMAGE_TAG:-0.0.1-SNAPSHOT}
    depends_on:
      config-server: { condition: service_healthy }
      service-registry: { condition: service_healthy }
      notificationdb: { condition: service_healthy }
      kafka: { condition: service_healthy }
    environment:
      <<: *service-env
      SERVER_PORT: 5012
      DB_URL: jdbc:mysql://notificationdb:3306/airline_notification_db
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      NOTIFICATION_FROM: ${NOTIFICATION_FROM:-no-reply@airline.local}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:5173}

  # ---------------------------------------------------------------- web app
  # The Angular site, served by nginx, which also forwards /api and /auth to the gateway (same origin, so
  # no CORS needed). Published on 5173 to match the PAYMENT_CALLBACK_BASE_URL and CORS defaults above.
  # While developing the frontend, use `npm start` in frontend/ instead (it also uses port 5173).
  web:
    build: ../frontend
    image: ${IMAGE_REGISTRY:-baldevsinh}/airline-web:${IMAGE_TAG:-0.0.1-SNAPSHOT}
    restart: unless-stopped
    logging: *logging
    mem_limit: 64m
    networks: [ edge ]
    ports: [ "5173:8080" ]
    environment:
      API_GATEWAY_URL: http://api-gateway:5000
    depends_on:
      api-gateway: { condition: service_healthy }

networks:
  # Business services publish no ports: clients can only reach them through the gateway on the edge network.
  backend: { }
  edge: { }

volumes:
  userdb-data:
  airlinecoredb-data:
  flightopsdb-data:
  locationdb-data:
  pricingdb-data:
  ancillarydb-data:
  bookingdb-data:
  paymentdb-data:
  seatdb-data:
  notificationdb-data:
  redis-data:
  kafka-data:
  prometheus-data:
  grafana-data:
