# Grafana Tempo, single binary with local storage: stores traces received from the OpenTelemetry Collector and
# serves them to Grafana. In a production cluster use object storage (S3, GCS, Azure) instead of the local disk.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

# Only the collector sends here (OTLP over gRPC inside the Docker network).
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 72h

# Service graph and RED metrics per span (requests, errors, duration), written to Prometheus: Grafana shows a
# live map of which service calls which, and dashboards can use span metrics.
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    metrics_generator:
      processors: [ service-graphs, span-metrics, local-blocks ]

usage_report:
  reporting_enabled: false
