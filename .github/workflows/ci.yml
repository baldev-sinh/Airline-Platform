name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Scans the commits of this push or pull request; known local-only defaults are allowlisted in .gitleaks.toml.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Services take the caller's identity only from the verified access token (CurrentUser), never from
      # X-User-* request headers, which anyone inside the network could send.
      - name: No identity headers in service code
        run: |
          if grep -rnE '"X-User-|RequestHeaders\.USER_' services/*/src/main; then
            echo "::error::Read the caller with CurrentUser instead of X-User-* headers"
            exit 1
          fi

      # Includes the Testcontainers integration tests (MySQL, Kafka, Redis); GitHub runners have Docker.
      - name: Build, unit and integration tests, coverage
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          retention-days: 7

  frontend:
    name: Frontend lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install exact locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:ci

      - name: Production build
        run: npm run build

      - name: Check for known vulnerabilities in production dependencies
        run: npm audit --omit=dev --audit-level=high

  images:
    name: Publish container images
    needs: [ secrets, build, frontend ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and push images with Jib (no Docker daemon required)
        run: >
          ./mvnw -B -ntp -DskipTests package jib:build
          -Dimage.registry=ghcr.io/${{ github.repository_owner }}
          -Dimage.tag=${{ github.sha }}
          -Djib.to.tags=main
          -Djib.to.auth.username=${{ github.actor }}
          -Djib.to.auth.password=${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GHCR for the web image
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          # Commit tag for pinning and rollback, plus a moving "main" tag for the latest build.
          tags: |
            ghcr.io/${{ github.repository_owner }}/airline-web:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/airline-web:main
